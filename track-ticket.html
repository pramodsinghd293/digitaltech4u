<!DOCTYPE html>
<html lang="en-IN" data-base=".">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track Support Ticket | digitaltech4u</title>
  <meta name="description" content="Track your digitaltech4u support ticket status with your ticket number.">
  <link rel="canonical" href="https://digitaltech4u.com/track-ticket.html">
  <link rel="icon" href="images/favicon-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <section class="page-hero">
      <img class="hero__bg" src="images/support-24-7.png" alt="Track support ticket">
      <div class="hero__overlay"></div>
      <div class="container hero__content">
        <p class="eyebrow">digitaltech4u · India's Best Web Agency</p>

      <div class="container" style="max-width:640px">
        <form class="consult-card" id="trackForm">
          <h3>Enter ticket number</h3>
          <input class="field" name="ticket" placeholder="DT4U-XXXXXX-XXXX" required>
          <button class="btn btn-red" type="submit">Check status</button>

        <div id="trackResult"></div>
      </div>

  <div id="site-footer"></div>
